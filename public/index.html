<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freelance Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="appbar">
      <div class="brand">Freelance Tracker</div>
      <nav class="breadcrumb">
        <button class="crumb active" id="crumb-dashboard">Dashboard</button>
        <span class="crumb-sep"><span>/</span></span>
        <button class="crumb" id="crumb-clientes">Clientes</button>
        <span id="crumb-cliente-wrap" class="crumb-sep hidden">
          <span>/</span>
          <span id="crumb-cliente-nombre"></span>
        </span>
      </nav>
    </header>

    <main>
      <!-- VISTA: DASHBOARD GENERAL -->
      <section id="view-dashboard" class="view active">
        <div class="view-header">
          <h1>Dashboard</h1>
          <div class="rango-selector">
            <select id="dashboard-rango">
              <option value="mes-actual">Este mes</option>
              <option value="mes-pasado">Mes pasado</option>
              <option value="anio-actual">Este año</option>
              <option value="personalizado">Personalizado</option>
            </select>
            <input type="date" id="dashboard-desde" class="hidden" />
            <span id="dashboard-rango-sep" class="hidden">&ndash;</span>
            <input type="date" id="dashboard-hasta" class="hidden" />
          </div>
        </div>
        <p class="rango-label" id="dashboard-rango-label"></p>
        <div class="table-wrap">
          <table id="tabla-dashboard">
            <thead>
              <tr>
                <th>Cliente</th>
                <th>Horas</th>
                <th>Ingreso</th>
                <th>Margen</th>
                <th>Rendimiento</th>
              </tr>
            </thead>
            <tbody id="tabla-dashboard-body"></tbody>
          </table>
        </div>
        <p id="dashboard-empty" class="empty-state hidden">No hay datos para el rango seleccionado.</p>
      </section>

      <!-- VISTA: LISTA DE CLIENTES -->
      <section id="view-clientes" class="view">
        <div class="view-header">
          <h1>Clientes</h1>
          <button class="btn btn-primary" id="btn-nuevo-cliente">+ Nuevo cliente</button>
        </div>
        <div id="grid-clientes" class="grid-clientes"></div>
        <p id="clientes-empty" class="empty-state hidden">Aún no tienes clientes. Crea el primero para empezar.</p>
      </section>

      <!-- VISTA: DETALLE DE CLIENTE -->
      <section id="view-cliente" class="view">
        <div class="view-header">
          <div class="view-header-title">
            <button class="btn-link" id="btn-volver">&larr; Clientes</button>
            <div class="title-row">
              <h1 id="cliente-detalle-nombre"></h1>
              <span class="badge badge-modo" id="cliente-detalle-modo"></span>
            </div>
          </div>
          <div class="view-header-actions">
            <button class="btn btn-secondary" id="btn-editar-cliente">Editar cliente</button>
            <button class="btn btn-primary" id="btn-nuevo-proyecto">+ Nuevo proyecto</button>
          </div>
        </div>
        <div id="grid-proyectos" class="grid-proyectos"></div>
        <p id="proyectos-empty" class="empty-state hidden">Este cliente aún no tiene proyectos.</p>
      </section>
    </main>
  </div>

  <!-- MODAL CLIENTE -->
  <div class="modal-overlay hidden" id="modal-cliente-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-cliente-title">Nuevo cliente</h2>
        <button class="btn-close" type="button" data-close-modal="modal-cliente-overlay">&times;</button>
      </div>
      <form id="form-cliente">
        <input type="hidden" name="id" />
        <label>
          Nombre
          <input type="text" name="nombre" required placeholder="Nombre del cliente" />
        </label>
        <label>
          Modo de facturación
          <select name="modo_facturacion" required>
            <option value="hora">Por hora</option>
            <option value="proyecto">Por proyecto</option>
            <option value="mixto">Mixto</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-close-modal="modal-cliente-overlay">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL PROYECTO -->
  <div class="modal-overlay hidden" id="modal-proyecto-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-proyecto-title">Nuevo proyecto</h2>
        <button class="btn-close" type="button" data-close-modal="modal-proyecto-overlay">&times;</button>
      </div>
      <form id="form-proyecto">
        <input type="hidden" name="id" />
        <input type="hidden" name="cliente_id" />
        <label>
          Nombre
          <input type="text" name="nombre" required placeholder="Nombre del proyecto" />
        </label>
        <label>
          Tipo de cobro
          <select name="tipo_cobro" id="proyecto-tipo-cobro" required>
            <option value="hora">Por hora</option>
            <option value="fijo">Precio fijo</option>
          </select>
        </label>
        <label id="campo-tarifa-hora">
          Tarifa por hora
          <input type="number" step="0.01" min="0" name="tarifa_hora" placeholder="0.00" />
        </label>
        <label id="campo-precio-fijo" class="hidden">
          Precio fijo
          <input type="number" step="0.01" min="0" name="precio_fijo" placeholder="0.00" />
        </label>
        <label>
          Estado
          <select name="estado">
            <option value="activo">Activo</option>
            <option value="pausado">Pausado</option>
            <option value="completado">Completado</option>
          </select>
        </label>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" data-close-modal="modal-proyecto-overlay">Cancelar</button>
          <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
